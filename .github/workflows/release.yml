name: Release to Maven Central and Gradle Plugins

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Optional: add required reviewers to this environment for a manual approval step.
    environment: maven-central
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Get the version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(M|RC)[0-9]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not v<major>.<minor>.<patch>[-M<n>|-RC<n>]."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build -PreleaseVersion=${{ steps.version.outputs.version }}
      - name: Sign and publish to Maven Central, Github Packages and Gradle Plugin Portal
        run: ./gradlew publishAndReleaseToMavenCentral publishPluginMavenPublicationToGitHubPackagesRepository publishPlugins -PreleaseVersion=${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      - name: Apply version to release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh ./update-release-notes.sh "RELEASE_NOTES_SUBST.md"
      - uses: ncipollo/release-action@v1
        with:
          bodyFile: "RELEASE_NOTES_SUBST.md"
          allowUpdates: true
          generateReleaseNotes: true
