plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    alias(libs.plugins.maven.publish)
    alias(libs.plugins.gradle.plugin.publish)
    alias(libs.plugins.asciidoctorj)
}

group = 'org.infosmid.plugins'

def getVersionFromFile() {
    def versionFile = new File(rootProject.projectDir, 'version.txt')
    return versionFile.text.trim()
}
version = providers.gradleProperty('releaseVersion').getOrNull() ?: getVersionFromFile()
description = 'Upload files to and download files from Amazon S3'
def projectName = 'Gradle S3 Plugin'
def projectDescription = project.description

repositories {
    mavenCentral()
}

jar {
    manifest {
        attributes([
                'Manifest-Version'      : '1.0',
                'Implementation-Version': project.version,
                'Build-Tag'             : project.version
        ])
    }
}

dependencies {
    implementation libs.aws.sdk.s3
    implementation libs.commons.io

    testImplementation(platform(libs.junit.bom))
    testImplementation(libs.junit.jupiter)
    testRuntimeOnly(libs.junit.platform.launcher)
    testImplementation libs.assertj.core
    testImplementation gradleTestKit()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

gradlePlugin {
    website.set('https://github.com/infosmid-org/s3-plugin')
    vcsUrl.set('https://github.com/infosmid-org/s3-plugin')
    plugins {
        register('org.infosmid.plugins.s3') {
            implementationClass = 'org.infosmid.plugins.gradle.s3.S3Plugin'
            displayName = projectName
            description = projectDescription
            tags.set(['s3', 'aws', 'upload', 'download'])
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/infosmid-org/${rootProject.name}")
            credentials {
                username = providers.environmentVariable('GITHUB_ACTOR').getOrElse('')
                password = providers.environmentVariable('GITHUB_TOKEN').getOrElse('')
            }
        }
    }
}

mavenPublishing {
    publishToMavenCentral()
    if (providers.gradleProperty('signingInMemoryKey').isPresent()) {
        signAllPublications()
    }
    coordinates(project.group.toString(), rootProject.name, project.version.toString())
    pom {
        name = projectName
        description = projectDescription
        inceptionYear = '2020'
        url = "https://github.com/infosmid-org/${rootProject.name}"
        licenses {
            license {
                name = 'The MIT License'
                url = 'https://opensource.org/licenses/MIT'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'corneil'
                name = 'Corneil du Plessis'
                url = 'https://github.com/corneil'
            }
        }
        scm {
            url = "https://github.com/infosmid-org/${rootProject.name}"
            connection = "scm:git:git://github.com/infosmid-org/${rootProject.name}.git"
            developerConnection = "scm:git:ssh://git@github.com/infosmid-org/${rootProject.name}.git"
        }
        issueManagement {
            system = 'GitHub'
            url = "https://github.com/infosmid-org/${rootProject.name}/issues"
        }
    }
}

// User guide is README.adoc included by src/docs/asciidoc/index.adoc
asciidoc {
    publications {
        main {
            sourceSet {
                sourceDir = 'src/docs/asciidoc'
                sources {
                    include 'index.adoc'
                }
                resources {
                    include '**/*.png'
                    include '**/*.xml'
                    include '**/*.js'
                    include '**/*.css'
                }
                attributes {
                    addAll 'toc': 'left',
                        'idprefix': '',
                        'idseparator': '-',
                        'docinfo1': '',
                        // Lets index.adoc link to the API docs: link:{api-docs}/index.html[API]
                        'api-docs': 'api'
                }
                missingIncludesAreFatal()
            }
            output 'asciidoctorj', 'html'
        }
    }
}

// Properties read by gradle/site-docs.gradle (siteDocsZip); must be set before it is applied.
// The plugin is published as org.infosmid.plugins:s3-plugin and the docs zip as
// org.infosmid:s3-plugin-doc, the same as local-properties-plugin.
ext {
    siteDocsTitle       = projectName
    siteDocsSummary     = projectDescription
    siteDocsGuideTask   = 'asciidoctorHtml'
    siteDocsApiTask     = 'javadoc'
    siteDocsPublication = 'pluginMaven'
    siteDocsArtifactId  = rootProject.name
    siteDocsGroupId     = 'org.infosmid'
    siteDocsTags        = ['Gradle', 'Plugin', 'S3', 'AWS']
    siteDocsLicense     = 'MIT'
    siteDocsSourceUrl   = "https://github.com/infosmid-org/${rootProject.name}".toString()
}
apply from: "$rootProject.projectDir/gradle/site-docs.gradle"

tasks.register('updateReadmeVersion') {
    group = 'documentation'
    description = 'Modifies :project-version: attribute at the top of README.adoc'
    def files = [layout.projectDirectory.file('README.adoc').asFile,layout.projectDirectory.dir('src/docs/asciidoc').file('index.adoc').asFile]
    def projectVersion = providers.provider { project.version.toString() }
    inputs.property('version', projectVersion)
    outputs.files(files)
    doLast {
        files.forEach { file ->
            if (file.exists()) {
                def content = file.text
                def versionStr = projectVersion.get()
                def versionAttr = ":project-version: ${versionStr}"
                if (content =~ /(?m)^:project-version:.*$/) {
                    content = content.replaceFirst(/(?m)^:project-version:.*$/, versionAttr)
                } else {
                    def matcher = content =~ /(?m)^(=[^\r\n]*\r?\n)/
                    if (matcher.find()) {
                        content = content.substring(0, matcher.end()) + versionAttr + "\n" + content.substring(matcher.end())
                    } else {
                        content = versionAttr + "\n" + content
                    }
                }
                file.text = content
                logger.lifecycle("$path:updated:$file with project_versio=$versionStr")
            } else {
                logger.warn("$path:cannot find:$file")
            }
        }
    }
}

asciidoctorHtml.dependsOn('updateReadmeVersion')

tasks.register('docs') {
    group = 'documentation'
    dependsOn('asciidoctorHtml', 'javadoc', 'siteDocsZip')
}

// Add a source set for the functional test suite
sourceSets {
    functionalTest {
    }
}

gradlePlugin.testSourceSets(sourceSets.functionalTest)
configurations.functionalTestImplementation.extendsFrom(configurations.testImplementation)
configurations.functionalTestRuntimeOnly.extendsFrom(configurations.testRuntimeOnly)

// Add a task to run the functional tests
tasks.register('functionalTest', Test) {
    group 'verification'
    testClassesDirs = sourceSets.functionalTest.output.classesDirs
    classpath = sourceSets.functionalTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.named('check') {
    // Run the functional tests as part of `check`
    dependsOn(tasks.functionalTest)
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
